name: the-closer
on:
  push:
    paths: ["the-closer/**", ".github/workflows/the-closer.yml"]
  pull_request:
    paths: ["the-closer/**", ".github/workflows/the-closer.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: the-closer } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: closer, POSTGRES_PASSWORD: closer, POSTGRES_DB: closer }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U closer" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TEST_DATABASE_URL: postgres://closer:closer@localhost:5432/closer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: the-closer/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @closer/core build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @closer/desktop build:renderer
      - run: pnpm --filter @closer/web build
        env: { NEXT_TELEMETRY_DISABLED: "1", NEXT_PUBLIC_API_URL: "https://api.thecloser.ai" }
